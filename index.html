<!DOCTYPE html>
<html lang="et" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AeroLogis - Professional GA Pilot Logbook</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        aviation: {
                            900: '#0b1329',
                            800: '#111d3b',
                            700: '#1b2a52',
                            600: '#273c75',
                            accent: '#38bdf8',
                            warning: '#fbbf24',
                            success: '#34d399'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono-code { font-family: 'JetBrains Mono', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111d3b; }
        ::-webkit-scrollbar-thumb { background: #273c75; border-radius: 3px; }
    </style>
</head>
<body class="bg-aviation-900 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-aviation-accent selection:text-aviation-900">

    <!-- Päis -->
    <header class="bg-aviation-800 border-b border-aviation-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-lg bg-aviation-600 flex items-center justify-center border border-aviation-accent/30 shadow-lg">
                    <i class="fa-solid fa-plane-departure text-aviation-accent text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-tight text-white flex items-center gap-2">
                        AeroLogis <span class="text-xs px-2 py-0.5 rounded bg-aviation-accent/10 text-aviation-accent border border-aviation-accent/20">MSFS 2024</span>
                    </h1>
                    <p class="text-xs text-slate-400">Professional GA Pilot Logbook (EASA/FAA)</p>
                </div>
            </div>
            <div id="header-actions" class="flex items-center space-x-3"></div>
        </div>
    </header>

    <!-- Peamine sisu -->
    <main id="app-container" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
        <div class="p-8 text-center text-slate-400">Laen rakendust...</div>
    </main>

    <!-- Uue lennu / muutmise modaal -->
    <div id="flight-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-aviation-800 border border-aviation-700 rounded-2xl w-full max-w-4xl overflow-hidden shadow-2xl max-h-[90vh] flex flex-col">
            <div class="px-6 py-4 border-b border-aviation-700 flex items-center justify-between bg-aviation-900/50">
                <h3 id="modal-title" class="font-bold text-white text-base flex items-center gap-2">
                    <i class="fa-solid fa-plane-circle-check text-aviation-accent"></i> Lisa uus lend
                </h3>
                <button onclick="closeNewFlightModal()" class="text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <form id="flight-form" class="p-6 space-y-4 overflow-y-auto flex-1">
                <input type="hidden" id="f-id">
                
                <!-- MSFS Andmete sissetoomise nupp -->
                <div class="bg-aviation-900/60 p-3 rounded-xl border border-aviation-accent/30 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-aviation-accent"></i>
                        <span class="text-xs font-medium text-slate-200">MSFS Live Andmed (valikuline)</span>
                    </div>
                    <button type="button" onclick="fillFlightFromSim()" class="bg-aviation-600 hover:bg-aviation-500 text-aviation-accent text-xs px-3 py-1.5 rounded-lg font-bold transition border border-aviation-accent/30 flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-download"></i> Täida andmed simulaatorist
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Kuupäev</label>
                        <input type="date" id="f-date" required class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-aviation-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Lennuk (Tüüp)</label>
                        <input type="text" id="f-type" placeholder="nt C172, DA40" required class="w-full uppercase bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-aviation-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Registrinumber</label>
                        <input type="text" id="f-reg" placeholder="nt ES-NOP" required class="w-full uppercase bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-aviation-accent">
                    </div>
                </div>

                <!-- Lemmiklennukite kiirvalik -->
                <div class="bg-aviation-900/40 p-3 rounded-xl border border-aviation-700/50 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-medium text-slate-300 flex items-center gap-1.5">
                            <i class="fa-solid fa-star text-aviation-warning"></i> Lemmiklennukite kiirvalik (Pilv)
                        </span>
                        <button type="button" onclick="toggleAddPresetForm()" class="text-[11px] text-aviation-accent hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-plus"></i> Lisa uus lemmiklennuk
                        </button>
                    </div>
                    <div id="preset-buttons-container" class="flex flex-wrap gap-2 pt-1">
                        <span class="text-[11px] text-slate-500">Laen kiirvalikuid...</span>
                    </div>
                    <div id="add-preset-box" class="hidden pt-2 border-t border-aviation-700/50 flex gap-2 items-center">
                        <input type="text" id="new-preset-type" placeholder="Tüüp (nt C152)" class="w-28 uppercase bg-aviation-900 border border-aviation-700 rounded px-2 py-1 text-xs text-white">
                        <input type="text" id="new-preset-reg" placeholder="Reg (nt ES-XYZ)" class="w-28 uppercase bg-aviation-900 border border-aviation-700 rounded px-2 py-1 text-xs text-white">
                        <button type="button" onclick="saveNewPreset()" class="bg-aviation-accent text-aviation-900 text-xs px-3 py-1 rounded font-bold hover:bg-sky-400">Salvesta</button>
                        <button type="button" onclick="toggleAddPresetForm()" class="text-slate-400 hover:text-white text-xs px-2 py-1">Loobu</button>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Väljumine (ICAO)</label>
                        <input type="text" id="f-dep" placeholder="EETN" maxlength="4" required class="w-full uppercase bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white font-mono-code focus:outline-none focus:border-aviation-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Saabumine (ICAO)</label>
                        <input type="text" id="f-arr" placeholder="EFHK" maxlength="4" required class="w-full uppercase bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white font-mono-code focus:outline-none focus:border-aviation-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Reaalne lennuaeg (h)</label>
                        <input type="number" step="0.1" id="f-time" placeholder="1.5" required class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white font-mono-code focus:outline-none focus:border-aviation-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Blokiaeg (Block Time, h)</label>
                        <input type="number" step="0.1" id="f-block-time" placeholder="1.7" required class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white font-mono-code focus:outline-none focus:border-aviation-accent">
                    </div>
                </div>

                <!-- Aja väljad (Kellaajad) -->
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3 bg-aviation-900/60 p-3 rounded-xl border border-aviation-700/50">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">OFFBLOCK</label>
                        <input type="datetime-local" id="f-offblock" onchange="calculateTimesFromClock()" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">TAKEOFF</label>
                        <input type="datetime-local" id="f-takeoff" onchange="calculateTimesFromClock()" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">LANDING</label>
                        <input type="datetime-local" id="f-landing" onchange="calculateTimesFromClock()" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">ONBLOCK</label>
                        <input type="datetime-local" id="f-onblock" onchange="calculateTimesFromClock()" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    </div>
                </div>

                <!-- Kütuse väljad -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-aviation-900/60 p-3 rounded-xl border border-aviation-700/50">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">KÜTUS ALGUSES</label>
                        <input type="number" step="0.1" id="f-fuel-start" placeholder="nt 44.0" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-aviation-warning mb-1"><i class="fa-solid fa-gas-pump"></i> TANKITUD (+)</label>
                        <input type="number" step="0.1" id="f-fuel-added" placeholder="nt 20.0" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white font-mono-code">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-300 mb-1">KÜTUS LÕPUS</label>
                        <input type="number" step="0.1" id="f-fuel-end" placeholder="nt 28.5" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-5 gap-4 bg-aviation-900/40 p-3 rounded-xl border border-aviation-700/50">
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Piloodi roll</label>
                        <select id="f-role" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-2 py-1.5 text-xs text-white focus:outline-none focus:border-aviation-accent">
                            <option value="PIC">PIC</option>
                            <option value="DUAL">Dual</option>
                            <option value="COPILOT">Co-Pilot</option>
                            <option value="FI">Instruktor</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Päevased maand.</label>
                        <input type="number" id="f-land-day" value="1" min="0" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Öised maand.</label>
                        <input type="number" id="f-land-night" value="0" min="0" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">IFR Tunnid</label>
                        <input type="number" step="0.1" id="f-ifr" value="0.0" min="0" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-1.5 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-medium text-slate-400 mb-1">Öötunnid</label>
                        <input type="number" step="0.1" id="f-night" value="0.0" min="0" class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-1.5 text-xs text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Märkmed / Lähenemised</label>
                    <textarea id="f-remarks" rows="2" placeholder="nt ILS lähenemine..." class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-aviation-accent"></textarea>
                </div>
                <div class="flex items-center justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeNewFlightModal()" class="bg-aviation-700 hover:bg-aviation-600 text-slate-300 text-xs px-4 py-2 rounded-lg font-medium transition">Katkesta</button>
                    <button type="submit" class="bg-aviation-accent hover:bg-sky-400 text-aviation-900 text-xs px-5 py-2 rounded-lg font-bold transition shadow">Salvesta lend</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Teavituste kast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-aviation-800 border border-aviation-accent/40 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transform translate-y-24 opacity-0 transition-all duration-300 z-50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-aviation-success"></i>
        <div>
            <div id="toast-title" class="text-xs font-bold">Teade</div>
            <div id="toast-msg" class="text-[11px] text-slate-300">Tegevus õnnestus</div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bijiichpwwajuvhzxzrz.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_oKp8QAlRwXgeJzzZ4JIZHQ_GU37-TmG';
        
        let supabaseClient = null;
        let currentFlights = [];
        let currentPresets = [];
        let isSimConnected = false;
        let telemetryInterval = null;
        let lastFlightEndFuel = null;

        window.onload = async function() {
            const dateField = document.getElementById('f-date');
            if (dateField) dateField.valueAsDate = new Date();

            if (typeof window.supabase === 'undefined') {
                document.getElementById('app-container').innerHTML = `<div class="p-8 text-center text-red-400">Viga: Supabase teek on blokeeritud. Kontrolli brauseri laiendusi.</div>`;
                return;
            }

            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            } catch (e) {
                console.error("Supabase init error:", e);
            }

            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                renderView(session);

                supabaseClient.auth.onAuthStateChange((_event, session) => {
                    renderView(session);
                });
            } catch (err) {
                document.getElementById('app-container').innerHTML = `<div class="p-8 text-center text-red-400">Andmebaasi ühenduse viga: ${err.message}</div>`;
            }
        };

        function renderView(session) {
            const headerActions = document.getElementById('header-actions');
            const appContainer = document.getElementById('app-container');

            if (!session) {
                headerActions.innerHTML = '';
                appContainer.innerHTML = `
                    <div class="max-w-md mx-auto bg-aviation-800/90 border border-aviation-700 rounded-2xl p-8 shadow-2xl mt-12">
                        <div class="text-center mb-6">
                            <div class="w-12 h-12 bg-aviation-accent/10 text-aviation-accent rounded-xl flex items-center justify-center mx-auto mb-3 border border-aviation-accent/20">
                                <i class="fa-solid fa-lock text-xl"></i>
                            </div>
                            <h2 class="text-xl font-bold text-white">Logi sisse AeroLogis kontole</h2>
                            <p class="text-xs text-slate-400 mt-1">Sinu isiklik lennupäevik pilveandmebaasis</p>
                        </div>
                        <form id="login-form" class="space-y-4">
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">E-post</label>
                                <input type="email" id="email" required class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-aviation-accent">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-300 mb-1">Parool</label>
                                <input type="password" id="password" required class="w-full bg-aviation-900 border border-aviation-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-aviation-accent">
                            </div>
                            <div class="flex gap-3 pt-2">
                                <button type="submit" class="flex-1 bg-aviation-accent hover:bg-sky-400 text-aviation-900 text-xs py-2.5 rounded-lg font-bold transition shadow">Logi sisse</button>
                                <button type="button" id="register-btn" class="flex-1 bg-aviation-700 hover:bg-aviation-600 text-slate-200 text-xs py-2.5 rounded-lg font-medium transition border border-aviation-700">Registreeri</button>
                            </div>
                        </form>
                        <div class="mt-4 pt-4 border-t border-aviation-700">
                            <button type="button" onclick="signInWithGoogle()" class="w-full bg-white hover:bg-slate-100 text-slate-900 text-xs py-2.5 rounded-lg font-bold transition flex items-center justify-center gap-2 shadow">
                                <i class="fa-brands fa-google text-red-500"></i> Logi sisse Google'iga
                            </button>
                        </div>
                    </div>
                `;

                document.getElementById('login-form').addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) showToast('Sisselogimise viga', error.message, 'warning');
                });

                document.getElementById('register-btn').addEventListener('click', async () => {
                    const email = document.getElementById('email').value;
                    const password = document.getElementById('password').value;
                    const { error } = await supabaseClient.auth.signUp({ email, password });
                    if (error) showToast('Registreerimise viga', error.message, 'warning');
                    else showToast('Konto loodud', 'Kontrolli e-posti kinnitust või logi sisse.');
                });

            } else {
                headerActions.innerHTML = `
                    <div id="sim-status-badge" class="hidden sm:flex items-center space-x-2 bg-aviation-900/80 px-3 py-1.5 rounded-full border border-aviation-700 text-xs font-medium">
                        <span id="sim-indicator" class="w-2.5 h-2.5 rounded-full bg-slate-500"></span>
                        <span id="sim-text" class="text-slate-300">MSFS Kontrollin...</span>
                    </div>
                    <button onclick="startNewSessionDirectly()" class="bg-aviation-700 hover:bg-aviation-600 text-aviation-warning text-xs px-3 py-2 rounded-lg font-medium transition border border-aviation-warning/30 flex items-center gap-1.5 shadow" title="Alusta simulaatoris uut otsa: seab uue OFFBLOCK aja ja toob eelmise kütuse kaasa">
                        <i class="fa-solid fa-rotate-right"></i> <span class="hidden md:inline">Uus ots (</span>Nulli seanss<span class="hidden md:inline">)</span>
                    </button>
                    <button onclick="openNewFlightModal()" class="bg-aviation-accent hover:bg-sky-400 text-aviation-900 text-xs px-4 py-2 rounded-lg font-bold transition flex items-center gap-2 shadow-lg shadow-aviation-accent/10">
                        <i class="fa-solid fa-plus"></i> Lisa lend
                    </button>
                    <button id="logout-btn" class="bg-red-600/80 hover:bg-red-600 text-white text-xs px-3 py-2 rounded-lg font-medium transition">Välju</button>
                `;

                document.getElementById('logout-btn').addEventListener('click', async () => {
                    if (telemetryInterval) clearInterval(telemetryInterval);
                    await supabaseClient.auth.signOut();
                });

                appContainer.innerHTML = `
                    <div id="telemetry-banner" class="bg-gradient-to-r from-aviation-800 to-aviation-700 border border-aviation-accent/30 rounded-xl p-4 shadow-xl">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div class="flex items-center space-x-3">
                                <div class="p-3 bg-aviation-accent/10 rounded-lg border border-aviation-accent/20 text-aviation-accent">
                                    <i class="fa-solid fa-tower-broadcast text-xl"></i>
                                </div>
                                <div>
                                    <h3 class="text-sm font-bold text-white flex items-center gap-2">
                                        MSFS 2024 Sild <span id="sim-live-tag" class="text-[10px] bg-slate-600 text-slate-300 px-2 py-0.5 rounded">OFFLINE</span>
                                    </h3>
                                    <p id="telemetry-route" class="text-xs text-slate-300">Simulaatori sild on valikuline (töötab ka ilma selleta)</p>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-center">
                                <div class="bg-aviation-900/60 px-3 py-1.5 rounded border border-aviation-700/50">
                                    <div class="text-[10px] text-slate-400 uppercase">Kõrgus</div>
                                    <div id="tel-alt" class="text-sm font-mono-code font-bold text-aviation-accent">0 ft</div>
                                </div>
                                <div class="bg-aviation-900/60 px-3 py-1.5 rounded border border-aviation-700/50">
                                    <div class="text-[10px] text-slate-400 uppercase">Kiirus</div>
                                    <div id="tel-gs" class="text-sm font-mono-code font-bold text-white">0 kts</div>
                                </div>
                                <div class="bg-aviation-900/60 px-3 py-1.5 rounded border border-aviation-700/50">
                                    <div class="text-[10px] text-slate-400 uppercase">Kurss</div>
                                    <div id="tel-hdg" class="text-sm font-mono-code font-bold text-white">0°</div>
                                </div>
                                <div class="bg-aviation-900/60 px-3 py-1.5 rounded border border-aviation-700/50">
                                    <div class="text-[10px] text-slate-400 uppercase">Aeg (Seanss)</div>
                                    <div id="tel-time" class="text-sm font-mono-code font-bold text-aviation-warning">00:00</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">

        async function fetchUserData(userId) {
            await Promise.all([
                fetchFlightsFromSupabase(userId),
                fetchPresetsFromSupabase(userId)
            ]);
        }

        async function fetchFlightsFromSupabase(userId) {
            const { data, error } = await supabaseClient
                .from('flights')
                .select('*')
                .eq('user_id', userId)
                .order('date', { ascending: false });

            if (error) {
                showToast('Viga', 'Lendude laadimine ebaõnnestus', 'warning');
                return;
            }

            currentFlights = data || [];
            renderLogbookTable(currentFlights);
            updateStatistics(currentFlights);
        }

        async function fetchPresetsFromSupabase(userId) {
            const { data, error } = await supabaseClient
                .from('aircraft_presets')
                .select('*')
                .eq('user_id', userId)
                .order('created_at', { ascending: true });

            if (error) return;
            currentPresets = data || [];
            renderPresetButtons();
        }

        function formatTimeShort(isoString) {
            if (!isoString) return '-';
            const parts = isoString.split('T');
            if (parts.length < 2) return '-';
            return parts[1].substring(0, 5);
        }

        function renderLogbookTable(flights) {
            const tbody = document.getElementById('logbook-table-body');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (flights.length === 0) {
                tbody.innerHTML = `<tr><td colspan="11" class="text-center py-8 text-slate-500">Lende ei ole veel sisestatud.</td></tr>`;
                return;
            }

            flights.forEach((f) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-aviation-700/30 transition border-b border-aviation-700/30 font-mono-code";
                
                const offStr = formatTimeShort(f.offblock);
                const onStr = formatTimeShort(f.onblock);
                const timesDisplay = (f.offblock || f.onblock) ? `${offStr} / ${onStr}` : '-';
                
                const fuelAddedVal = Number(f.fuel_added || 0);
                const fuelDisplay = (f.fuel_start !== null && f.fuel_end !== null) 
                    ? `${f.fuel_start} ${fuelAddedVal > 0 ? `<span class="text-aviation-warning font-bold">(+${fuelAddedVal})</span>` : ''} / ${f.fuel_end}` 
                    : '-';

                tr.innerHTML = `
                    <td class="py-3 px-4 text-slate-300 font-sans">${f.date}</td>
                    <td class="py-3 px-4 font-bold text-white">${f.aircraft_type || f.type} <span class="text-xs font-normal text-slate-400">(${f.aircraft_reg || f.reg})</span></td>
                    <td class="py-3 px-4"><span class="text-aviation-accent font-bold">${f.departure_icao || f.dep}</span> <i class="fa-solid fa-arrow-right text-[10px] text-slate-500 mx-1"></i> <span class="text-aviation-warning font-bold">${f.arrival_icao || f.arr}</span></td>
                    <td class="py-3 px-4 text-white font-bold">${Number(f.flight_time || f.time || 0).toFixed(1)} hrs</td>
                    <td class="py-3 px-4 text-aviation-accent font-bold">${Number(f.block_time || 0).toFixed(1)} hrs</td>
                    <td class="py-3 px-4 text-slate-300 text-[11px]">${timesDisplay}</td>
                    <td class="py-3 px-4 text-slate-300 text-[11px]">${fuelDisplay}</td>
                    <td class="py-3 px-4"><span class="px-2 py-0.5 rounded text-[10px] font-bold bg-aviation-accent/10 text-aviation-accent border border-aviation-accent/20">${f.role || 'PIC'}</span></td>
                    <td class="py-3 px-4 text-center"><span class="text-white">${f.landings_day ?? f.landDay ?? 0}</span>${(f.landings_night ?? f.landNight ?? 0) > 0 ? `<span class="text-aviation-warning ml-1">(${(f.landings_night ?? f.landNight)}N)</span>` : ''}</td>
                    <td class="py-3 px-4 text-slate-400 font-sans truncate max-w-xs">${f.remarks || '-'}</td>
                    <td class="py-3 px-4 text-right space-x-1">
                        <button onclick="openNewFlightModal('${f.id}')" class="text-slate-400 hover:text-aviation-accent p-1 transition" title="Muuda">
                            <i class="fa-solid fa-pen-to-square text-xs"></i>
                        </button>
                        <button onclick="deleteFlight('${f.id}')" class="text-slate-400 hover:text-red-400 p-1 transition" title="Kustuta">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStatistics(flights) {
            let totalTime = 0, picTime = 0, ifrTime = 0, nightTime = 0, dayLandings = 0, nightLandings = 0;

            flights.forEach(f => {
                const time = Number(f.flight_time || f.time || 0);
                totalTime += time;
                if ((f.role || 'PIC') === 'PIC' || f.role === 'FI') picTime += time;
                ifrTime += Number(f.ifr_time || f.ifr || 0);
                nightTime += Number(f.night_time || f.night || 0);
                dayLandings += Number(f.landings_day ?? f.landDay ?? 0);
                nightLandings += Number(f.landings_night ?? f.landNight ?? 0);
            });

            if (document.getElementById('stat-total-time')) {
                document.getElementById('stat-total-time').innerText = totalTime.toFixed(1) + ' hrs';
                document.getElementById('stat-pic-time').innerText = picTime.toFixed(1) + ' hrs';
                document.getElementById('stat-ifr-time').innerText = ifrTime.toFixed(1);
                document.getElementById('stat-night-time').innerText = nightTime.toFixed(1);
                document.getElementById('stat-day-landings').innerText = dayLandings;
                document.getElementById('stat-night-landings').innerText = nightLandings;
            }
        }

        function calculateTimesFromClock() {
            const offblockVal = document.getElementById('f-offblock').value;
            const takeoffVal = document.getElementById('f-takeoff').value;
            const landingVal = document.getElementById('f-landing').value;
            const onblockVal = document.getElementById('f-onblock').value;

            if (takeoffVal && landingVal) {
                const t1 = new Date(takeoffVal);
                const t2 = new Date(landingVal);
                const diffHours = (t2 - t1) / (1000 * 60 * 60);
                if (diffHours > 0) {
                    document.getElementById('f-time').value = diffHours.toFixed(1);
                }
            }

            if (offblockVal && onblockVal) {
                const o1 = new Date(offblockVal);
                const o2 = new Date(onblockVal);
                const diffBlock = (o2 - o1) / (1000 * 60 * 60);
                if (diffBlock > 0) {
                    document.getElementById('f-block-time').value = diffBlock.toFixed(1);
                }
            }
        }

        async function deleteFlight(id) {
            if (!confirm('Kas oled kindel, et soovid selle lennu kustutada?')) return;
            const { error } = await supabaseClient.from('flights').delete().eq('id', id);
            if (error) {
                showToast('Viga', error.message, 'warning');
            } else {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session) fetchFlightsFromSupabase(session.user.id);
                showToast('Kustutatud', 'Lennukanne eemaldatud.');
            }
        }

        function filterLogbook() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = currentFlights.filter(f => 
                (f.departure_icao || f.dep || '').toLowerCase().includes(query) ||
                (f.arrival_icao || f.arr || '').toLowerCase().includes(query) ||
                (f.aircraft_type || f.type || '').toLowerCase().includes(query) ||
                (f.aircraft_reg || f.reg || '').toLowerCase().includes(query) ||
                (f.remarks || '').toLowerCase().includes(query)
            );
            renderLogbookTable(filtered);
        }

        // Uus ots pealehelt: seab uue OFFBLOCK aja, toob kütuse ja saadab andmed ka sillale
        async function startNewSessionDirectly() {
            openNewFlightModal();

            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const formattedCurrentTime = `${year}-${month}-${day}T${hours}:${minutes}`;
            
            document.getElementById('f-offblock').value = formattedCurrentTime;

            if (lastFlightEndFuel !== null) {
                document.getElementById('f-fuel-start').value = lastFlightEndFuel;
            }

            if (isSimConnected) {
                const resetPayload = {
                    telemetry: {
                        offblockTime: formattedCurrentTime + ':00',
                        fuelStart: lastFlightEndFuel !== null ? lastFlightEndFuel : undefined,
                        takeoffTime: null,
                        landingTime: null,
                        onblockTime: null,
                        fuelEnd: null
                    }
                };

                try {
                    await fetch('http://localhost:3000/', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(resetPayload),
                        signal: AbortSignal.timeout(1500)
                    });
                    showToast('Uus ots & Sild', 'Uus seanss alustatud ja saadetud ka simulaatori sillale.');
                } catch (err) {
                    showToast('Uus ots', 'OFFBLOCK seatud (sild ei vastanud, andmed vormis valmis).', 'warning');
                }
            } else {
                showToast('Uus ots', 'Uus seanss alustatud: OFFBLOCK seatud praegusele ajale, vana kütus kaasas.');
            }
        }

        function closeNewFlightModal() { 
            document.getElementById('flight-modal').classList.add('hidden'); 
        }

        async function fillFlightFromSim() {
            try {
                const response = await fetch('http://localhost:3000/', { signal: AbortSignal.timeout(1500) });
                if (!response.ok) throw new Error();
                const data = await response.json();
                
                if (data && data.telemetry) {
                    const t = data.telemetry;
                    if (t.aircraftType) document.getElementById('f-type').value = t.aircraftType.toUpperCase();
                    if (t.aircraftReg) document.getElementById('f-reg').value = t.aircraftReg.toUpperCase();
                    if (t.departureIcao) document.getElementById('f-dep').value = t.departureIcao.toUpperCase();
                    if (t.arrivalIcao) document.getElementById('f-arr').value = t.arrivalIcao.toUpperCase();
                    
                    if (t.flightTime !== undefined && t.flightTime !== null) document.getElementById('f-time').value = t.flightTime;
                    if (t.blockTime !== undefined && t.blockTime !== null) document.getElementById('f-block-time').value = t.blockTime;
                    
                    if (t.offblockTime) document.getElementById('f-offblock').value = t.offblockTime.slice(0, 16);
                    if (t.takeoffTime) document.getElementById('f-takeoff').value = t.takeoffTime.slice(0, 16);
                    if (t.landingTime) document.getElementById('f-landing').value = t.landingTime.slice(0, 16);
                    if (t.onblockTime) document.getElementById('f-onblock').value = t.onblockTime.slice(0, 16);
                    
                    if (t.fuelStart !== undefined && t.fuelStart !== null) {
                        document.getElementById('f-fuel-start').value = t.fuelStart;
                    } else if (lastFlightEndFuel !== null) {
                        document.getElementById('f-fuel-start').value = lastFlightEndFuel;
                    }

                    if (t.fuelEnd !== undefined && t.fuelEnd !== null) document.getElementById('f-fuel-end').value = t.fuelEnd;

                    calculateTimesFromClock();
                    showToast('SimConnect', 'Andmed toodud simulaatorist!');
                }
            } catch (err) {
                showToast('Teade', 'Simulaatori sild ei ole kättesaadav (töötad pilvirežiimis).', 'warning');
            }
        }

        async function sendManualOverrideToSim() {
            if (!isSimConnected) return;
            
            const telemetryData = {
                telemetry: {
                    aircraftType: document.getElementById('f-type').value,
                    aircraftReg: document.getElementById('f-reg').value,
                    offblockTime: document.getElementById('f-offblock').value ? document.getElementById('f-offblock').value + ':00' : null,
                    takeoffTime: document.getElementById('f-takeoff').value ? document.getElementById('f-takeoff').value + ':00' : null,
                    landingTime: document.getElementById('f-landing').value ? document.getElementById('f-landing').value + ':00' : null,
                    onblockTime: document.getElementById('f-onblock').value ? document.getElementById('f-onblock').value + ':00' : null,
                    fuelStart: parseFloat(document.getElementById('f-fuel-start').value) || null,
                    fuelEnd: parseFloat(document.getElementById('f-fuel-end').value) || null
                }
            };

            try {
                await fetch('http://localhost:3000/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(telemetryData),
                    signal: AbortSignal.timeout(1000)
                });
            } catch (err) {
                // Summutatud
            }
        }

        async function autoStartSimTelemetry() {
            const indicator = document.getElementById('sim-indicator');
            const simText = document.getElementById('sim-text');
            const simLiveTag = document.getElementById('sim-live-tag');

            try {
                const response = await fetch('http://localhost:3000/', { signal: AbortSignal.timeout(1500) });
                if (!response.ok) throw new Error();
                const result = await response.json();
                
                isSimConnected = true;
                if (indicator) indicator.className = "w-2.5 h-2.5 rounded-full bg-aviation-success animate-ping";
                if (simText) simText.innerText = `MSFS Ühendatud (${result.sim})`;
                if (simLiveTag) {
                    simLiveTag.className = "text-[10px] bg-aviation-success/20 text-aviation-success px-2 py-0.5 rounded";
                    simLiveTag.innerText = "ONLINE";
                }

                if (telemetryInterval) clearInterval(telemetryInterval);
                telemetryInterval = setInterval(async () => {
                    try {
                        const res = await fetch('http://localhost:3000/', { signal: AbortSignal.timeout(1000) });
                        const data = await res.json();
                        if (data && data.telemetry) {
                            document.getElementById('tel-alt').innerText = Math.round(data.telemetry.altitude) + ' ft';
                            document.getElementById('tel-gs').innerText = Math.round(data.telemetry.speed) + ' kts';
                            document.getElementById('tel-hdg').innerText = Math.round(data.telemetry.heading) + '°';
                            document.getElementById('telemetry-route').innerText = `Lennuk: ${data.telemetry.aircraftType} (${data.telemetry.aircraftReg})`;
                        }
                    } catch (e) {
                        isSimConnected = false;
                        if (indicator) indicator.className = "w-2.5 h-2.5 rounded-full bg-slate-500 animate-none";
                        if (simText) simText.innerText = "MSFS Offline";
                    }
                }, 1000);
            } catch (err) {
                isSimConnected = false;
                if (indicator) indicator.className = "w-2.5 h-2.5 rounded-full bg-slate-500 animate-none";
                if (simText) simText.innerText = "MSFS Sild puudub (Töötab pilvirežiimis)";
            }
        }

        function exportLogbook() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(currentFlights, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `aerologis_logbook.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('Eksport', 'Andmed laaditud JSON failina.');
        }

        function showToast(title, msg, type = 'success') {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            const icon = document.getElementById('toast-icon');
            icon.className = type === 'warning' ? "fa-solid fa-triangle-exclamation text-aviation-warning text-lg" : "fa-solid fa-circle-check text-aviation-success text-lg";

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-24', 'opacity-0'), 3500);
        }
    </script>
</body>
